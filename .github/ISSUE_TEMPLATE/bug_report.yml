name: Bug report
description: Report a problem with Twitch Channel Points Miner
labels: [bug]

body:
  - type: textarea
    id: description
    attributes:
      label: Describe the bug
      description: |
        A clear and concise description of what the bug is.
    validations:
      required: true
  - type: textarea
    id: steps-to-reproduce
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Configure the relevant settings in run.py.
        2. Start the miner.
        3. Describe the event that triggers the problem.
        4. Include the relevant log excerpt.
    validations:
      required: true
  - type: textarea
    id: expected-behavior
    attributes:
      label: Expected behavior
      description: What do you expect to happen?
    validations:
      required: true
  - type: input
    id: operating-system
    attributes:
      label: Operating system
      placeholder: Windows 11, Ubuntu, or Docker host and architecture
    validations:
      required: true
  - type: input
    id: python-version
    attributes:
      label: Python version
      placeholder: "3.12 (or the Docker image tag)"
    validations:
      required: true
  - type: input
    id: miner-version
    attributes:
      label: Miner version
      placeholder: "2.2.0 or the commit SHA"
    validations:
      required: true
  - type: textarea
    id: other-environment-info
    attributes:
      label: Other relevant software versions
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: |
        How to provide a DEBUG log:
        1. Set this in your runner script (`run.py`):
        ```py
        LOGGER_SETTINGS = LoggerSettings(
          save=True,
          console_level=logging.INFO,
          file_level=logging.DEBUG,
          less=True,
        )
        ```
        Pass LOGGER_SETTINGS as logger_settings when constructing the miner.
        2. Reproduce the problem and include the relevant excerpt from `logs/<username>.log`.
        3. Remove tokens, webhook URLs, cookies, and private account details before sharing.
        You can paste a sanitized excerpt here or link a GitHub Gist: https://gist.github.com/.
    validations:
      required: true
  - type: textarea
    id: other-info
    attributes:
      label: Additional context
      description: Add any other context about the problem here.
